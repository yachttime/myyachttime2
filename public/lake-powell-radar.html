<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake Powell Live Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 56px; background: #1e293b; }
    .controls {
      position: absolute; bottom: 0; left: 0; right: 0; height: 56px;
      background: #1e293b; border-top: 1px solid #334155;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      z-index: 1000;
    }
    .btn {
      background: #334155; color: #e2e8f0; border: 1px solid #475569;
      border-radius: 6px; padding: 8px 14px; cursor: pointer;
      font-size: 14px; transition: background 0.2s; white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn:active { background: #3b82f6; }
    .timestamp { color: #94a3b8; font-size: 13px; white-space: nowrap; }
    .slider-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .slider-wrap input[type=range] { flex: 1; min-width: 60px; accent-color: #3b82f6; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 16px; z-index: 999; }
    .legend {
      position: absolute; top: 12px; right: 12px; z-index: 999;
      background: rgba(15, 23, 42, 0.85); border: 1px solid #334155;
      border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #cbd5e1;
    }
    .legend-bar { display: flex; gap: 1px; margin-top: 4px; height: 10px; width: 140px; }
    .legend-bar span { flex: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loading" class="loading">Loading radar data...</div>
  <div class="legend">
    <div>Light &nbsp;→&nbsp; Heavy</div>
    <div class="legend-bar">
      <span style="background:#00bfff"></span><span style="background:#00ffff"></span>
      <span style="background:#00ff00"></span><span style="background:#80ff00"></span>
      <span style="background:#ffff00"></span><span style="background:#ffbf00"></span>
      <span style="background:#ff8000"></span><span style="background:#ff0000"></span>
    </div>
  </div>
  <div class="controls">
    <button id="playBtn" class="btn">&#9658; Play</button>
    <button id="prevBtn" class="btn">&#10094;</button>
    <button id="nextBtn" class="btn">&#10095;</button>
    <div class="slider-wrap">
      <input type="range" id="frameSlider" min="0" max="0" value="0" />
      <span id="timestamp" class="timestamp">--</span>
    </div>
  </div>
<script>
(function() {
  var LAKE_POWELL_LAT = 36.9147;
  var LAKE_POWELL_LON = -111.4558;
  var ZOOM = 8;

  var map = L.map('map', { zoomControl: true, attributionControl: true }).setView([LAKE_POWELL_LAT, LAKE_POWELL_LON], ZOOM);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  L.marker([LAKE_POWELL_LAT, LAKE_POWELL_LON]).addTo(map).bindPopup('Lake Powell / Page, AZ');

  var radarLayers = [];
  var frames = [];
  var animationPosition = 0;
  var playing = false;
  var playTimer = null;
  var colorScheme = 4;
  var smooth = 1;
  var snow = 1;

  var loadingEl = document.getElementById('loading');
  var playBtn = document.getElementById('playBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var slider = document.getElementById('frameSlider');
  var timestampEl = document.getElementById('timestamp');

  function pad(n) { return n < 10 ? '0' + n : n; }

  function formatTime(ts) {
    var d = new Date(ts * 1000);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' UTC';
  }

  function showFrame(nextPosition) {
    if (frames.length === 0) return;
    nextPosition = (nextPosition + frames.length) % frames.length;
    if (radarLayers[animationPosition]) {
      map.removeLayer(radarLayers[animationPosition]);
    }
    animationPosition = nextPosition;
    if (!radarLayers[animationPosition]) {
      var f = frames[animationPosition];
      radarLayers[animationPosition] = L.tileLayer(f.path + '/256/{z}/{x}/{y}/' + colorScheme + '/' + smooth + '_' + snow + '.png', {
        opacity: 0.7,
        tileSize: 256,
        zIndex: 200
      });
    }
    radarLayers[animationPosition].addTo(map);
    slider.value = animationPosition;
    timestampEl.textContent = formatTime(frames[animationPosition].time);
  }

  function play() {
    if (frames.length === 0) return;
    playing = true;
    playBtn.innerHTML = '&#10074;&#10074; Pause';
    playTimer = setInterval(function() {
      showFrame(animationPosition + 1);
    }, 600);
  }

  function stop() {
    playing = false;
    playBtn.innerHTML = '&#9658; Play';
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
  }

  function playStop() {
    if (playing) { stop(); } else { play(); }
  }

  playBtn.addEventListener('click', playStop);
  prevBtn.addEventListener('click', function() { stop(); showFrame(animationPosition - 1); });
  nextBtn.addEventListener('click', function() { stop(); showFrame(animationPosition + 1); });
  slider.addEventListener('input', function() { stop(); showFrame(parseInt(slider.value, 10)); });

  fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var host = data.host;
      var past = data.radar && data.radar.past ? data.radar.past : [];
      var nowcast = data.radar && data.radar.nowcast ? data.radar.nowcast : [];

      frames = [];
      past.forEach(function(f) {
        frames.push({ time: f.time, path: host + f.path });
      });
      if (nowcast.length > 0) {
        nowcast.forEach(function(f) {
          frames.push({ time: f.time, path: host + f.path });
        });
      }

      if (frames.length === 0) {
        loadingEl.textContent = 'No radar data available';
        return;
      }

      loadingEl.style.display = 'none';
      slider.max = frames.length - 1;

      showFrame(frames.length - 1);
      play();
    })
    .catch(function(err) {
      loadingEl.textContent = 'Failed to load radar data';
      console.error('Radar load error:', err);
    });
})();
</script>
</body>
</html>
